name: Build DeepSeek Harness Runtime

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Independent DeepSeek Harness runtime version (e.g. v0.1.1)'
        required: true
        type: string
        default: 'v0.1.1'
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  REGISTRY: ghcr.io
  REPO: agentteams-group

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Up GitHub Actions Ubuntu Runner Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests
        run: make test

      - name: Resolve runtime version
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${GIT_REF}" == refs/tags/v* ]]; then
            VERSION="${REF_NAME}"
          else
            VERSION="sha-${COMMIT_SHA:0:12}"
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [[ "${GIT_REF}" == refs/tags/v* ]]; then
            if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "ERROR: invalid runtime version: ${VERSION}"
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and smoke test image
        run: |
          make build
          make smoke
          make direct-control-smoke

      - name: Login to Registry
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          RUNTIME_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          make push \
            VERSION="${RUNTIME_VERSION}" \
            IMAGE="${REGISTRY}/${REPO}/agentteams-harness-deepseek"

      - name: Verify published image
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          IMAGE="${REGISTRY}/${REPO}/agentteams-harness-deepseek:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}"
          MANIFEST="$(docker buildx imagetools inspect --raw "${IMAGE}")"
          # jq -e alone accepts empty stdin, so reject it explicitly.
          if [[ -z "${MANIFEST}" ]]; then
            echo "ERROR: ${IMAGE} returned an empty manifest"
            exit 1
          fi
          for PLATFORM in linux/amd64 linux/arm64; do
            if ! jq -e --arg platform "${PLATFORM}" \
              'any(.manifests[]?; ((.platform.os // "") + "/" + (.platform.architecture // "")) == $platform)' \
              <<<"${MANIFEST}" >/dev/null; then
              echo "ERROR: ${IMAGE} is missing ${PLATFORM}"
              exit 1
            fi
          done
          {
            echo "### DeepSeek Harness Runtime"
            echo ""
            echo "- Image: \`${IMAGE}\`"
            echo "- Platforms: \`linux/amd64, linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
